apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-gateway
  namespace: streaming-metrics
  labels:
    app.kubernetes.io/name: metrics-gateway
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: metrics-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metrics-gateway
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: gateway
          image: metrics-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: metrics-pipeline-config
            - secretRef:
                name: metrics-pipeline-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
