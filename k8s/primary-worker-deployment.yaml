apiVersion: apps/v1
kind: Deployment
metadata:
  name: primary-worker
  namespace: streaming-metrics
  labels:
    app.kubernetes.io/name: primary-worker
    app.kubernetes.io/component: stream-processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: primary-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: primary-worker
        app.kubernetes.io/component: stream-processor
    spec:
      containers:
        - name: worker
          image: metrics-primary-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: metrics-pipeline-config
            - secretRef:
                name: metrics-pipeline-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
